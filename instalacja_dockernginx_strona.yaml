---
- name: Instalacja Docker, i strony na Nginx
  hosts: docker.grzegorzek.lan
  become: yes

  vars:
    dependency_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    keyring_path: /etc/apt/keyrings/docker.asc

  tasks:
    - name: DOCKER - Sprawdź, czy docker jest zainstalowany.
      command: docker
      register: result
      ignore_errors: yes

    - name: UBUNTU and DEBIAN DOCKER - Zainstaluj zależności pakietów
      apt:
        name: "{{ dependency_packages }}"
        state: present
        update_cache: yes
      when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and (result.rc != 0)

    - name: Dodaj klucz GPG Docker (Debian/Ubuntu)
      get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: "{{ keyring_path }}"
        mode: "0644"
      when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and (result.rc != 0)

    - name: Dodaj repozytorium Docker (Debian/Ubuntu)
      apt_repository:
        repo: >-
          deb [arch=amd64 signed-by={{ keyring_path }}] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable
        state: present
        filename: docker
      when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and (result.rc != 0)

    - name: Instalacja Dockera i Docker Compose plugin
      apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: yes
      when: (ansible_distribution == 'Debian' or ansible_distribution == 'Ubuntu') and (result.rc != 0)

    - name: Sprawdzenie wersji Docker
      command: docker --version
      register: docker_ver
      changed_when: false

    - name: Sprawdzenie wersji Docker Compose
      command: docker compose version
      register: compose_ver
      changed_when: false

    - name: Wyświetl wersję Docker
      debug:
        msg: "Docker version: {{ docker_ver.stdout }}"

    - name: Wyswietl wersję Docker Compose
      debug:
        msg: "Docker Compose version: {{ compose_ver.stdout }}"

    - name: Instalacja kontenera NGINX
      docker_container:
        name: www-example
        image: nginx
        state: started
        recreate: true
        restart_policy: unless-stopped
        ports:
          - '80:80'
        volumes:
          - "/home/kursant/www-example:/usr/share/nginx/html"
    - name: Kopiowanie katalogu z witryną www
      copy:
        src: strona/
        dest: /home/kursant/www-example/
        force: yes
